# diablo-dark skin bundle patch: inserts its dshClient row into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path-or-git-url>`; mutual exclusion between
# skins is managed by the skin-center plugin.
- insert:
    - id: ui-skin-diablo-dark
      name: '@dengxuhui/dsh-client-ui-skin-diablo-dark'
